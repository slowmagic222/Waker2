name: symbolize-tmp
on:
  push:
    branches: ['claude/symbolize-tmp']
permissions:
  actions: read
  contents: read
jobs:
  sym:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: waker2-steamdeck-7fe39bb
          run-id: 41584046473
          github-token: ${{ github.token }}
          path: exe
      - run: |
          cd exe && ls -la && for t in *.tar.gz; do tar xzf "$t" waker2/switchwaker; done; ls -la waker2
          objdump -d --no-show-raw-insn -C --start-address=0x8a6880 --stop-address=0x8a6960 waker2/switchwaker | tail -70
          echo "== crash"
          objdump -d --no-show-raw-insn -C --start-address=0x8a8800 --stop-address=0x8a8880 waker2/switchwaker | tail -40
